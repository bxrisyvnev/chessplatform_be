variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - build
  - test
  - deploy
  - build-sonar

build:
  stage: build
  script:
    - ./gradlew assemble

test:
  stage: test
  script:
    - ./gradlew test

deploy:
  stage: deploy

  # remove image/services—on Shell exec these are ignored
  before_script:
    # if you need to auth to a private registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    # tear down any old stack
    - docker compose -f docker-compose.yml down

    # bring up MySQL + BE
    - docker compose -f docker-compose.yml up -d --build

    # wait for mysql
    - Write-Host "Waiting for MySQL to be ready..."
    - |
      while (-not (docker exec mysql mysqladmin ping -h 'localhost' `
            --user 'springuser' --password $env:DATASOURCE_PASS --silent)) {
        Write-Host "MySQL is unavailable - waiting..."
        Start-Sleep -Seconds 5
      }

    # sanity check
    - docker ps

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "DevelopmentBranch"'


build-sonar:
  stage: build-sonar
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - 'echo SONAR_HOST_URL=%SONAR_HOST_URL%'
    - 'echo TOKEN_LEN=%SONAR_TOKEN:~0,0%%SONAR_TOKEN%'
    - cmd /C "gradlew.bat -Dsonar.host.url=%SONAR_HOST_URL% -Dsonar.login=%SONAR_TOKEN% -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 test jacocoTestReport sonarqube"
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'