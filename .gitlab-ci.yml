variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - build
  - test
  - deploy
  - build-sonar

build:
  stage: build
  script:
    - ./gradlew assemble

test:
  stage: test
  script:
    - ./gradlew test

deploy:
  stage: deploy

  # (no image/services—uses your Windows runner’s native Docker & Compose)
  script:
    # 1) Tear down any old stack (ignore errors if nothing’s up)
    - |
      try {
        docker-compose down
      } catch {
        Write-Host "Nothing to tear down."
      }

    # 2) Build & start everything
    - docker-compose up -d --build

    # 3) Wait for MySQL to accept connections
    - Write-Host "Waiting for MySQL to be ready..."
    - |
      while (-not (
        docker exec mysql mysqladmin ping -h "localhost" `
          --user="springuser" `
          --password=$Env:DATASOURCE_PASS `
          --silent
      )) {
        Write-Host "MySQL is unavailable - waiting..."
        Start-Sleep -Seconds 5
      }

    # 4) Show running containers
    - docker ps

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "DevelopmentBranch"'


build-sonar:
  stage: build-sonar
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - 'echo SONAR_HOST_URL=%SONAR_HOST_URL%'
    - 'echo TOKEN_LEN=%SONAR_TOKEN:~0,0%%SONAR_TOKEN%'
    - cmd /C "gradlew.bat -Dsonar.host.url=%SONAR_HOST_URL% -Dsonar.login=%SONAR_TOKEN% -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 test jacocoTestReport sonarqube"
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'