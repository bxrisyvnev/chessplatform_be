spring.application.name=ChessplatformBE

#Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chessplatform_db
spring.datasource.username=springuser
spring.datasource.password=${DATASOURCE_PASS}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#Token
jwt.access-token.secret=${JWT_SECRET}
jwt.access-token.exp=60
jwt.access-token.exp-unit=minutes
