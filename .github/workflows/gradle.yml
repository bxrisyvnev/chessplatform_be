name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: ./gradlew assemble --no-daemon

  test:
    runs-on: self-hosted
    needs: build
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATASOURCE_PASS: ${{ secrets.DATASOURCE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: ./gradlew test --no-daemon

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref_name == 'DevelopmentBranch'
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATASOURCE_PASS: ${{ secrets.DATASOURCE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy stack (mysql + backend + existing frontend image)
        run: |
          docker compose -p chessplatform up -d --build
          docker ps

  sonar:
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew test jacocoTestReport sonarqube \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            --no-daemon
