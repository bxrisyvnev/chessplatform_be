name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: ./gradlew assemble --no-daemon

  test:
    runs-on: self-hosted
    needs: build
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SECURITY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew test --no-daemon

  # deploy:
  #   runs-on: self-hosted
  #   needs: test
  #   if: github.ref_name == 'DevelopmentBranch'
  #   env:
  #     JWT_SECRET: ${{ secrets.JWT_SECRET }}
  #     DATASOURCE_PASS: ${{ secrets.DATASOURCE_PASS }}
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chessplatform_db
  #     SPRING_DATASOURCE_USERNAME: springuser
  #     SPRING_DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASS }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Deploy with Docker Compose
  #       run: |
  #         docker compose down
  #         docker compose up -d --build
  #         docker ps

  sonar:
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'pull_request'
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: SonarQube Analysis
        run: |
          ./gradlew test jacocoTestReport sonarqube \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
