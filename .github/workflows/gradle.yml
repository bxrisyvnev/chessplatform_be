name: Backend CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: ./gradlew assemble --no-daemon

  test:
    runs-on: self-hosted
    needs: build
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATASOURCE_PASS: ${{ secrets.DATASOURCE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: ./gradlew test --no-daemon

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref_name == 'DevelopmentBranch'
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATASOURCE_PASS: ${{ secrets.DATASOURCE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --------------------
      # Build & push backend
      # --------------------
      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/chessplatform-be:latest \
            -t ghcr.io/${{ github.repository_owner }}/chessplatform-be:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/chessplatform-be:latest
          docker push ghcr.io/${{ github.repository_owner }}/chessplatform-be:${{ github.sha }}

      # --------------------
      # Pull, tag & push MySQL
      # --------------------
      - name: Pull MySQL image
        run: docker pull mysql:8.0

      - name: Tag MySQL image for GHCR
        run: |
          docker tag mysql:8.0 \
            ghcr.io/${{ github.repository_owner }}/chessplatform-mysql:8.0

      - name: Push MySQL image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/chessplatform-mysql:8.0

  sonar:
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew test jacocoTestReport sonarqube \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            --no-daemon

          # test
