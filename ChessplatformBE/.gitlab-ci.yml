image: openjdk:17  # Use OpenJDK 17 (change if using a different version)

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"  # Disable Gradle daemon for CI
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"  # Use project dir for Gradle cache

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

stages:
  - build
  - test

before_script:
  - chmod +x gradlew  # Ensure Gradle wrapper is executable

build:
  stage: build
  script:
    - ./gradlew clean assemble
  artifacts:
    paths:
      - build/libs/*.jar  # Store the JAR file as an artifact

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    paths:
      - build/reports/tests/test/  # Store test reports
    expire_in: 7 days
